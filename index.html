   ================================================================== */
function renderMethod() {
  const d = S.data;
  const rowsHtml = LEAGUES.map(l => {
    const ps = d.played.filter(r => r.comp === l.code && r.season === d.cur);
    const fx = d.fixtures.filter(r => r.comp === l.code);
    const last = ps.reduce((m, r) => Math.max(m, r.day), 0);
    return `<tr><td>${esc(leagueName(l.code))}</td><td class="r num">${esc(fmtInt(ps.length))}</td><td class="r num">${esc(fmtInt(fx.length))}</td><td class="r">${last ? esc(fmtDay(last, { day: 'numeric', month: 'short' })) : '—'}</td></tr>`;
  }).join('');
  const cups = d.played.filter(r => r.cup).length;
  const xw = CFG.xgWeight || 0;
  $('method').innerHTML = `<div>
      <p>${th('m1', { rho: dec(S.M.rho, 3) })}</p>
      <p>${th('m2', { hl: fmtInt(CFG.halfLife), n: fmtInt(S.M.n), cups: fmtInt(cups) })}</p>
      ${xw > 0 && d.xgN ? `<p>${th('m5', { w: pct(xw), g: pct(1 - xw), p1: pct1(0.0074), p2: pct1(0.0027) })}</p>` : ''}
      <p>${th('m3')}</p>
      <p>${th('m4')}</p>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:6px">${th('freshTitle', { s: seasonLabel(d.cur) })}</div>
      <div class="table-wrap"><table><thead><tr><th>${esc(tx('thLeague'))}</th><th class="r">${esc(tx('thPlayed'))}</th><th class="r">${esc(tx('thScheduled'))}</th><th class="r">${esc(tx('thLast'))}</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
      <p class="note" style="margin-top:10px">${esc(tx('freshNote'))}${d.failed ? ' ' + esc(tx('failedFiles', { n: d.failed })) : ''}</p>
      ${sourcesPanel()}
    </div>`;
}

// "3 hours ago" in the reader's language
function ago(isoStr) {
  const t = Date.parse(isoStr);
  if (!Number.isFinite(t)) return '—';
  const rtf = new Intl.RelativeTimeFormat(LOCALE[LANG], { numeric: 'auto' });
  const min = Math.round((t - Date.now()) / 60000);
  if (Math.abs(min) < 60) return rtf.format(min, 'minute');
  const h = Math.round(min / 60);
  if (Math.abs(h) < 48) return rtf.format(h, 'hour');
  return rtf.format(Math.round(h / 24), 'day');
}

function sourcesPanel() {
  const d = S.data, snap = d.snap;
  const dateOf = s => (s ? fmtDay(parseDay(s), { day: 'numeric', month: 'short' }) : '—');
  const pill = (s) => {
    if (!s) return `<span class="pill">${esc(tx('stOff'))}</span>`;
    if (s.ok === false) return `<span class="pill err">${esc(tx('stErr'))}</span>`;
    if (s.carriedOver) return `<span class="pill">${esc(tx('stOld'))}</span>`;
    return `<span class="pill ok">${esc(tx('stOk'))}</span>`;
  };
  const src = snap ? snap.sources || {} : {};
  const fd = src['football-data.org'], us = src.Understat, ol = src.OpenLigaDB, od = src['The Odds API'];
  const rows = [
    ['openfootball', { ok: true }, dateOf(S.lastDay ? isoDay(S.lastDay) : null), tx('srcBase', { n: fmtInt(d.ofCount) })],
    ['football-data.org', fd, fd && dateOf(fd.lastMatch), fd && fd.ok !== false ? tx('srcFd', { n: fmtInt(d.extraN), f: fmtInt((snap.cupFixtures || []).length) }) : (fd && fd.error) || ''],
    ['Understat', us, us && dateOf(us.lastMatch), us && us.ok !== false ? tx('srcXg', { n: fmtInt(d.xgN) }) : ''],
    ['OpenLigaDB', ol, ol && dateOf(ol.lastMatch), ol && ol.ok !== false ? tx('srcOl', { n: fmtInt(ol.matches || 0) }) : ''],
    ['The Odds API', od, od && od.fetchedAt ? ago(od.fetchedAt) : '—', od && od.ok !== false ? tx('srcOdds', { n: fmtInt(d.odds.size), r: od.remaining == null ? '—' : od.remaining, h: od.refreshHours || 24 }) : (od && od.error) || ''],
  ];
  const conf = snap ? snap.conflicts || [] : [];
  const confHtml = !snap ? '' : conf.length
    ? `<p class="note" style="margin-top:10px">${esc(tx('confSome', { n: conf.length }))}</p><ul class="conflicts">${conf.map(c => `<li dir="auto">${esc(fmtDay(parseDay(c.d), { day: 'numeric', month: 'short', year: 'numeric' }))} · ${esc(shortName(c.h))} – ${esc(shortName(c.a))} · ${Object.entries(c.scores).map(([k, v]) => esc(k) + ' ' + esc(v.replace('-', tx('scoreSep')))).join(' / ')}</li>`).join('')}</ul>`
    : `<p class="note" style="margin-top:10px">${esc(tx('confNone'))}</p>`;
  return `<div class="eyebrow" style="margin:18px 0 6px">${esc(tx('srcTitle'))}</div>
    <p class="note" style="margin-bottom:6px">${esc(snap ? tx('srcAge', { ago: ago(snap.generated) }) : tx('srcNoSnap'))}</p>
    <div class="table-wrap"><table class="src"><thead><tr><th>${esc(tx('thSource'))}</th><th>${esc(tx('thStatus'))}</th><th>${esc(tx('thFresh'))}</th><th>${esc(tx('thNote'))}</th></tr></thead><tbody>
      ${rows.map(([name, s, fresh, note]) => `<tr><td>${esc(name)}</td><td>${pill(s)}</td><td>${esc(fresh || '—')}</td><td>${esc(note || '')}</td></tr>`).join('')}
    </tbody></table></div>${confHtml}`;
}

/* ==================================================================
   WIRING
   ================================================================== */
$('lang').innerHTML = LANGS.map(l => `<option value="${l.code}" lang="${l.code}">${esc(l.label)}</option>`).join('');
$('lang').addEventListener('change', e => setLang(e.target.value, true));
setupCombo('home');
setupCombo('away');
$('swap').addEventListener('click', () => { [S.home, S.away] = [S.away, S.home]; renderPicker(); renderResult(); });
$('neutral').addEventListener('change', e => { S.neutral = e.target.checked; renderResult(); });
$('reload').addEventListener('click', boot);
setLang(detectLang(), false);
boot();
</script>
