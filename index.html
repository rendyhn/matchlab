<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchLab</title>
<meta name="description" content="Win, draw and loss chances for Europe's football leagues, recomputed from the latest results every time the page opens.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='1' width='14' height='15' rx='3' fill='%23177A55'/%3E%3Crect x='9' y='17' width='14' height='5' fill='%238A8D85'/%3E%3Crect x='9' y='23' width='14' height='8' rx='3' fill='%232F55C7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ------------------------------------------------------------------
   Tokens. Light is the base palette; dark redefines tokens only.
   1 = home (pitch green), X = draw (chalk grey), 2 = away (kit blue).
------------------------------------------------------------------- */
:root {
  --ground: #F1F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8EDE9;
  --ink: #0F1A16;
  --muted: #5A6760;
  --line: #D4DBD6;
  --home: #177A55;
  --draw: #8A8D85;
  --away: #2F55C7;
  --win: #177A55;
  --loss: #C4412B;
  --on-strong: #FFFFFF;
  --focus: #2F55C7;
  --shadow: 0 1px 0 rgb(15 26 22 / 0.04), 0 10px 28px -16px rgb(15 26 22 / 0.28);
  --radius: 14px;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
/* Scripts the Latin faces do not cover: the Latin face stays first (team names are Latin),
   the script face fills in the glyphs it lacks. */
:root[lang="zh"] {
  --f-display: "Big Shoulders Display", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  --f-body: "Figtree", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
}
:root[lang="ar"] {
  --f-display: "Big Shoulders Display", "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --f-body: "Figtree", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
/* Arabic letters join; any letter-spacing breaks the joins. */
:root[lang="ar"] body * { letter-spacing: 0 !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0C1311;
    --surface: #131C19;
    --surface-2: #1B2622;
    --ink: #E7EEEA;
    --muted: #93A099;
    --line: #26332E;
    --home: #3BBE8A;
    --draw: #A4A79F;
    --away: #7D9BFF;
    --win: #3BBE8A;
    --loss: #F0735E;
    --on-strong: #07100D;
    --focus: #7D9BFF;
    --shadow: 0 1px 0 rgb(0 0 0 / 0.3), 0 12px 30px -18px rgb(0 0 0 / 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0C1311;
  --surface: #131C19;
  --surface-2: #1B2622;
  --ink: #E7EEEA;
  --muted: #93A099;
  --line: #26332E;
  --home: #3BBE8A;
  --draw: #A4A79F;
  --away: #7D9BFF;
  --win: #3BBE8A;
  --loss: #F0735E;
  --on-strong: #07100D;
  --focus: #7D9BFF;
  --shadow: 0 1px 0 rgb(0 0 0 / 0.3), 0 12px 30px -18px rgb(0 0 0 / 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: 0 48px;
}
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin-inline: auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--away); text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 14px 24px; padding-block: 22px 18px;
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { display: grid; grid-template-rows: 7fr 3fr 4fr; width: 14px; height: 40px; border-radius: 3px; overflow: hidden; flex: none; }
.mark i:nth-child(1) { background: var(--home); }
.mark i:nth-child(2) { background: var(--draw); }
.mark i:nth-child(3) { background: var(--away); }
.brand h1 { font: 800 34px/0.95 var(--f-display); letter-spacing: 0.01em; text-transform: uppercase; }
.brand p { color: var(--muted); font-size: 13.5px; max-width: 52ch; margin-top: 4px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status {
  display: inline-flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  font-size: 13px; color: var(--muted); max-width: 100%;
}
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--draw); flex: none; }
.status.live .dot { background: var(--win); box-shadow: 0 0 0 4px color-mix(in srgb, var(--win) 22%, transparent); }
.status.bad .dot { background: var(--loss); }
.status b { color: var(--ink); font-weight: 600; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.lang {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding-block: 2px; padding-inline: 10px 4px; color: var(--muted);
}
.lang svg { flex: none; }
.lang select { border: 0; background: transparent; padding: 4px 4px; font-size: 13px; color: var(--ink); cursor: pointer; max-width: 170px; }
.lang select:focus { outline: none; }
.lang:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
section + section { margin-top: 28px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; margin-bottom: 12px; }
.sec-head h2 { font: 800 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.01em; }
.sec-head p { color: var(--muted); font-size: 13.5px; max-width: 64ch; margin-top: 4px; }

/* ---------- picker ---------- */
.predictor { padding: 18px; }
.picker { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px 12px; align-items: end; }
.side-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.side-label .tag { font: 800 15px/1 var(--f-display); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--on-strong); }
.tag.h { background: var(--home); }
.tag.a { background: var(--away); }
.combo { position: relative; min-width: 0; }
.combo input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--ground); font-weight: 600; font-size: 16px;
}
.combo input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.combo ul {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; max-height: 320px; overflow: auto;
  margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow);
}
.combo li.grp { font: 600 10.5px/1 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.combo li.opt { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.combo li.opt small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.combo li.opt[aria-selected="true"], .combo li.opt:hover { background: var(--surface-2); }
.combo li.none { padding: 10px; color: var(--muted); }
.swap {
  width: 44px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface);
  cursor: pointer; display: grid; place-items: center; color: var(--muted);
}
.swap:hover { color: var(--ink); background: var(--surface-2); }
.options { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 13.5px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--home); }

/* ---------- result ---------- */
.result { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
.card { background: var(--ground); border-radius: 12px; padding: 18px; }
.verdict { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 18px; }
.verdict h3 { font: 800 clamp(30px, 5vw, 46px)/0.95 var(--f-display); text-transform: uppercase; letter-spacing: 0.005em; }
.verdict h3 small { display: block; font: 600 14px/1.3 var(--f-body); text-transform: none; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
.verdict .big { font: 800 clamp(54px, 9vw, 84px)/0.85 var(--f-display); font-variant-numeric: tabular-nums; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.badge.warn { border-color: color-mix(in srgb, var(--loss) 45%, var(--line)); color: var(--loss); }

.bar { margin-top: 20px; }
.bar-track { display: flex; height: 18px; border-radius: 6px; overflow: hidden; margin: 8px 0; background: var(--surface-2); }
.bar-track > span { display: block; min-width: 2px; transition: flex-basis 0.5s ease; }
.seg-h { background: var(--home); }
.seg-x { background: var(--draw); }
.seg-a { background: var(--away); }
.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.outcome { background: var(--surface); border-radius: 10px; padding: 10px 12px; border-top: 3px solid var(--line); min-width: 0; }
.outcome.h { border-top-color: var(--home); }
.outcome.x { border-top-color: var(--draw); }
.outcome.a { border-top-color: var(--away); }
.outcome .who { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outcome .p { font: 800 30px/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.outcome .odds { font-size: 12.5px; color: var(--muted); }
.outcome .odds b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 14px; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font: 500 19px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }

.grid-wrap { overflow-x: auto; }
.scoregrid { display: grid; grid-template-columns: 30px repeat(6, minmax(40px, 1fr)); gap: 3px; min-width: 300px; }
.scoregrid .ax { font: 500 12px/1 var(--f-mono); color: var(--muted); display: grid; place-items: center; min-height: 26px; }
.scoregrid .cell {
  aspect-ratio: 1.25; border-radius: 6px; display: grid; place-items: center;
  font: 500 12.5px/1 var(--f-mono); font-variant-numeric: tabular-nums;
}
.scoregrid .cell.best { outline: 2.5px solid var(--ink); outline-offset: -2.5px; }
.grid-cap { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
.toplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin-top: 12px; }
.toplist div { background: var(--surface); border-radius: 8px; padding: 7px 10px; display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.toplist b { font-family: var(--f-mono); font-weight: 500; }

.teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.team { border-radius: 12px; padding: 16px 18px; border: 1px solid var(--line); background: var(--surface); }
.team.h { border-inline-start: 5px solid var(--home); }
.team.a { border-inline-start: 5px solid var(--away); }
.team h4 { margin: 0; font: 800 26px/1 var(--f-display); text-transform: uppercase; }
.team .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.rating { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; margin-top: 14px; font-size: 13px; }
.rating .track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.rating .fill { height: 100%; border-radius: 3px; }
.rating .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 5px; margin-top: 14px; flex-wrap: wrap; }
.chip { min-width: 30px; height: 30px; padding-inline: 6px; border-radius: 6px; display: grid; place-items: center; font: 700 13px/1 var(--f-body); color: var(--on-strong); cursor: default; }
.chip.w { background: var(--win); }
.chip.d { background: var(--draw); }
.chip.l { background: var(--loss); }
.chip.sm { min-width: 20px; height: 20px; font-size: 11px; border-radius: 4px; padding-inline: 3px; }
.lastline { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.h2h { margin-top: 18px; }
.h2h table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.h2h td { padding: 7px 8px; border-top: 1px solid var(--line); }
.h2h td.sc { text-align: center; font-family: var(--f-mono); white-space: nowrap; }
.h2h td.dt { color: var(--muted); white-space: nowrap; }
.h2h td.hm { text-align: end; }
.empty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }

/* ---------- fixtures ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.fixtures { padding: 6px 0; }
.fday { padding: 12px 18px 4px; }
.frow {
  display: grid; grid-template-columns: 52px 40px minmax(0, 1fr) minmax(120px, 190px) minmax(0, 1fr);
  align-items: center; gap: 10px; padding: 9px 18px; border-top: 1px solid var(--line); cursor: pointer;
  width: 100%; text-align: start; background: none; border-inline: 0; border-bottom: 0; font-size: 14px;
}
.frow:hover { background: var(--surface-2); }
.frow .t { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.frow .lg { font: 600 10.5px/1 var(--f-body); letter-spacing: 0.08em; color: var(--muted); }
.frow .hn { text-align: end; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .an { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { display: flex; flex-direction: column; gap: 4px; }
.mini .track { display: flex; height: 8px; border-radius: 3px; overflow: hidden; }
.mini .nums { display: flex; justify-content: space-between; font: 500 11.5px/1 var(--f-mono); color: var(--muted); }
.mini .nums .fav { color: var(--ink); }

/* ---------- ranking ---------- */
.table-wrap { overflow-x: auto; }
table.rank { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.rank th { text-align: start; font: 600 11px/1.2 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 12px 14px 8px; }
.rank td { padding: 9px 14px; border-top: 1px solid var(--line); }
.rank td.r, .rank th.r { text-align: end; }
.rank td .num { font-size: 13.5px; }
.rank tr.pick { cursor: pointer; }
.rank tr.pick:hover td { background: var(--surface-2); }
.lgtag { font: 600 10.5px/1 var(--f-body); letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; white-space: nowrap; }
.gd { display: inline-block; min-width: 54px; text-align: end; }
.gd.pos { color: var(--win); }
.gd.neg { color: var(--loss); }

/* ---------- accuracy ---------- */
.acc { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; padding: 18px; }
.acc-cards { display: grid; gap: 12px; align-content: start; }
.acc-card { background: var(--ground); border-radius: 12px; padding: 14px 16px; }
.acc-card h3 { font: 800 20px/1 var(--f-display); text-transform: uppercase; }
.acc-card .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
.kv div { background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.kv .k { font-size: 11.5px; color: var(--muted); }
.kv .v { font: 500 18px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.kv .v small { font-size: 12px; color: var(--muted); }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress span { display: block; height: 100%; background: var(--home); width: 0; transition: width 0.3s; }
.chart svg { width: 100%; height: auto; display: block; direction: ltr; }
.chart .cap { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.note { font-size: 13.5px; color: var(--muted); }

/* ---------- method ---------- */
.method { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; padding: 18px; }
.method p + p { margin-top: 10px; }
.method p { max-width: 68ch; }
.method table { width: 100%; border-collapse: collapse; font-size: 13px; }
.method td, .method th { padding: 6px 8px; border-top: 1px solid var(--line); text-align: start; }
.method th { border-top: 0; font: 600 11px/1.2 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.method td.r, .method th.r { text-align: end; }

.loading { padding: 32px 18px; text-align: center; color: var(--muted); }
.loading .progress { max-width: 320px; margin: 14px auto 0; }
.error { padding: 24px 18px; }
.error h3 { font: 800 22px/1.1 var(--f-display); text-transform: uppercase; color: var(--loss); }
.error p { margin-top: 8px; color: var(--muted); max-width: 64ch; }
.error button { margin-top: 14px; }
footer { margin-top: 36px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* ---------- market (bookmaker consensus) ---------- */
.market { margin-top: 14px; background: var(--surface); border-radius: 10px; padding: 10px 12px; border: 1px dashed var(--line); }
.market .row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; font-size: 13px; }
.market .row b { font-family: var(--f-mono); font-weight: 500; }
.market .track { display: flex; height: 8px; border-radius: 3px; overflow: hidden; margin: 8px 0 6px; opacity: 0.75; }
.market .diff { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.market .note { font-size: 11.5px; margin-top: 6px; }
.mkt-line { font: 500 10.5px/1 var(--f-mono); color: var(--muted); margin-top: 2px; }

/* ---------- standings ---------- */
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.tbl th { text-align: start; font: 600 11.5px/1.2 var(--f-body); letter-spacing: 0.02em; color: var(--muted); padding: 12px 10px 8px; white-space: nowrap; }   /* no uppercase: keeps "xG" */
.tbl td { padding: 8px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
.tbl td.r, .tbl th.r { text-align: end; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tr.pick { cursor: pointer; }
.tbl tr.pick:hover td { background: var(--surface-2); }
.tbl tr.me td { background: color-mix(in srgb, var(--home) 10%, transparent); }
.tbl .pos { font: 800 16px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tbl .pts { font: 800 17px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tbl .mdl { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.tbl .mdl.up { color: var(--win); }
.tbl .mdl.down { color: var(--loss); }
.tbl-foot { padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- sources ---------- */
.src { width: 100%; border-collapse: collapse; font-size: 13px; }
.src td, .src th { padding: 7px 8px; border-top: 1px solid var(--line); text-align: start; vertical-align: top; }
.src th { border-top: 0; font: 600 11px/1.2 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--win); border-color: color-mix(in srgb, var(--win) 45%, var(--line)); }
.pill.err { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 45%, var(--line)); }
.conflicts { margin: 8px 0 0; padding-inline-start: 18px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 900px) {
  .result, .acc, .method { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .picker { grid-template-columns: minmax(0, 1fr) auto; }
  .picker .combo-away-wrap { grid-column: 1 / 2; }
  .picker .swap { grid-row: 1 / 3; grid-column: 2; align-self: center; }
  .teams { grid-template-columns: minmax(0, 1fr); }
  .frow { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "t hn an" "lg mini mini"; row-gap: 6px; }
  .frow .t { grid-area: t; }
  .frow .lg { grid-area: lg; }
  .frow .hn { grid-area: hn; text-align: start; }
  .frow .an { grid-area: an; text-align: end; }
  .frow .mini { grid-area: mini; }
  .outcome .p { font-size: 26px; }
  .brand h1 { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

  m1: '<b>Modell.</b> Jedes Team hat zwei Zahlen: Angriffs- und Abwehrstärke. Die Tore jedes Teams in einem Spiel folgen einer Poisson-Verteilung, deren Mittelwert aus diesen beiden Zahlen und dem Heimvorteil seiner Liga entsteht. Die Dixon-Coles-Korrektur (ρ = {rho}) passt niedrige Ergebnisse wie 0:0 und 1:1 an, die häufiger vorkommen, als ein reines Poisson-Modell erwartet.',

let LANG = 'en';
let NF = null;

// Plain text: for textContent, or wrapped in esc() for attributes.
function tx(key, vars) {
  const s = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : (vars[k] && vars[k].raw !== undefined ? vars[k].raw : String(vars[k])))) : s;
}
// HTML: the template keeps its tags, every inserted value is escaped (unless passed as {raw: html}).
function th(key, vars) {
  const s = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : (vars[k] && vars[k].raw !== undefined ? vars[k].raw : esc(vars[k])))) : s;
}

function detectLang() {
  const h = (location.hash || '').slice(1);
  if (I18N[h]) return h;
  // 'laga1x2.lang' = the key used before the rename to MatchLab
  try { const s = localStorage.getItem('matchlab.lang') || localStorage.getItem('laga1x2.lang'); if (s && I18N[s]) return s; } catch (e) { /* storage blocked */ }
  for (const l of (navigator.languages || [navigator.language || ''])) {
    const c = String(l).toLowerCase().slice(0, 2);
    if (I18N[c]) return c;
  }
  return 'en';
}

function buildFormatters() {
  const loc = LOCALE[LANG];
  NF = {
    pct0: new Intl.NumberFormat(loc, { style: 'percent', maximumFractionDigits: 0 }),
    pct1: new Intl.NumberFormat(loc, { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 }),
    d0: new Intl.NumberFormat(loc, { maximumFractionDigits: 0 }),
    d1: new Intl.NumberFormat(loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
    d2: new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
    d3: new Intl.NumberFormat(loc, { minimumFractionDigits: 3, maximumFractionDigits: 3 }),
  };
}

function ensureFonts(code) {
  const href = FONTS[code];
  if (!href || document.getElementById('font-' + code)) return;
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = href; l.id = 'font-' + code;
  document.head.appendChild(l);
}

function applyStatic() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tx(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = tx(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tx(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', tx(el.dataset.i18nAria)); });
  $('lang').setAttribute('aria-label', tx('langLabel'));
  $('foot-data').innerHTML = th('footData', { link: { raw: '<a href="https://github.com/openfootball/football.json" target="_blank" rel="noopener">openfootball / football.json</a>' } });
}

function setLang(code, save) {
  LANG = I18N[code] ? code : 'en';
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  ensureFonts(LANG);
  buildFormatters();
  $('lang').value = LANG;
  if (save) {
    try { localStorage.setItem('matchlab.lang', LANG); } catch (e) { /* storage blocked */ }
    try { history.replaceState(null, '', '#' + LANG); } catch (e) { /* file:// may refuse */ }
  }
  applyStatic();
  renderStatus();
  if (S.M) {
    renderPicker(); renderResult(); renderStandings(); renderFixtures(); renderRanking(); renderMethod(); renderAccuracy();
  } else {
    renderLoading();
    if (!$('pick-hint').dataset.set) $('pick-hint').textContent = tx('hintStart');
  }
}

const HISTORY_ONLY = ['es.2', 'de.2', 'it.2', 'fr.2'];   // history of promoted clubs
// The link between league strengths. Files openfootball has not published yet (404) are still
// requested so they are used as soon as they appear; those 404s are expected and handled.
const CUPS = ['uefa.cl'];
// Settings chosen by a walk-forward test on season 2025/26 (2,892 matches, 3-way log-loss):
//   half-life 150/240/365/540 days x sigma 0.15/0.25/0.40 -> best 240 days, sigma 0.40 (1.0062);
//   sigma 0.40/0.55/0.75/1.00 at 240 days -> 1.0062 / 1.0061 / 1.0065 / 1.0070. The curve is flat
//   around the minimum, so 240 days and sigma 0.5 are used. The current season took no part in the choice.
// xgWeight: share of Understat xG blended into the fit's targets (0 = goals only). model-lab/xg_test.py,
// walk-forward log-loss, goals only -> 60% xG (+ Champions League 2025/26-2026/27 from football-data.org):
//   2025/26 (weight chosen here)  1.0061 -> 1.0034   (xG 25/50/75/100%: 1.0041 / 1.0034 / 1.0034 / 1.0040)
//   2024/25 (independent season)  1.0047 -> 0.9973   top-5 leagues 0.9959 -> 0.9836
//   2026/27 first 5 weeks, n=421  1.0042 -> 1.0068   (about one standard error: noise at this size)
const CFG = { halfLife: 240, sigma: 0.5, tau: 0.5, homeSd: 0.1, maxIter: 400, tol: 1e-5, xgWeight: 0.6 };
const MAXG = 10;
const LG = Object.fromEntries(LEAGUES.map(l => [l.code, l]));
const UCL = 'uefa.cl';
const DISPLAY_COMPS = LEAGUES.concat([{ code: UCL, short: 'UCL' }]);
const leagueName = code => (code === UCL ? tx('ucl') : ((I18N[LANG].leagues && I18N[LANG].leagues[code]) || (LG[code] ? LG[code].name : code)));
const lgShort = code => (code === UCL ? 'UCL' : (LG[code] ? LG[code].short : code));

/* ==================================================================
   DATES (integer day numbers, UTC)
   ================================================================== */
const DAYMS = 86400000;
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAYMS; };
const todayDay = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAYMS; };
const dayDate = d => new Date(d * DAYMS);
const mondayOf = d => d - ((d + 3) % 7);           // 1 Jan 1970 was a Thursday
function seasonKeyOf(day) {
  const dt = dayDate(day); const y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1;
  const s = m >= 7 ? y : y - 1;
  return `${s}-${String((s + 1) % 100).padStart(2, '0')}`;
}
const seasonStart = key => Date.UTC(+key.slice(0, 4), 6, 1) / DAYMS;
const prevSeason = key => { const s = +key.slice(0, 4) - 1; return `${s}-${String((s + 1) % 100).padStart(2, '0')}`; };
const seasonLabel = key => `${key.slice(0, 4)}/${key.slice(5)}`;
const fmtDay = (d, opt) => dayDate(d).toLocaleDateString(LOCALE[LANG], Object.assign({ timeZone: 'UTC' }, opt || { weekday: 'short', day: 'numeric', month: 'short' }));

/* ==================================================================
   FORMATTING (follows the chosen language)
   ================================================================== */
const pct = p => (p < 0.005 ? '<' + NF.pct0.format(0.01) : NF.pct0.format(p));
const pct1 = p => NF.pct1.format(p);
const dec = (x, n = 2) => NF['d' + n].format(x);
const fmtInt = n => NF.d0.format(n);
const odds = p => (p > 0.001 ? dec(1 / p) : '—');
const score = (a, b) => `${a}${tx('scoreSep')}${b}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cleanName = n => n.replace(/\s*\([A-Z]{3}\)\s*$/, '').trim();

// Official names in the data are often long. Legal-form prefixes/suffixes are dropped, then the
// names that are still too long are replaced by what people actually call the club.
const ALIAS = {
  'Sport Lisboa e Benfica': 'Benfica', 'Sporting Clube de Portugal': 'Sporting CP', 'Sporting Clube de Braga': 'Braga',
  'Club Atlético de Madrid': 'Atlético Madrid', 'Internazionale Milano': 'Inter',
  'Racing Club de Lens': 'Lens', 'Olympique Lyonnais': 'Lyon', 'Olympique de Marseille': 'Marseille',
  'Stade Rennais': 'Rennes', 'Stade Brestois 29': 'Brest', 'Strasbourg Alsace': 'Strasbourg', 'Paris': 'Paris FC',
  'Rayo Vallecano de Madrid': 'Rayo Vallecano', 'Espanyol de Barcelona': 'Espanyol', 'Real Betis Balompié': 'Real Betis',
  'Celta de Vigo': 'Celta Vigo', 'Brighton & Hove Albion': 'Brighton', 'Wolverhampton Wanderers': 'Wolves',
  'Tottenham Hotspur': 'Tottenham', 'Feyenoord Rotterdam': 'Feyenoord', 'Bayer 04 Leverkusen': 'Leverkusen',
  'Borussia Mönchengladbach': "M'gladbach", 'Twente \'65': 'Twente',
};
// "Brighton & Hove Albion FC" -> "Brighton", "TSG 1899 Hoffenheim" -> "Hoffenheim", "SV 07 Elversberg" -> "Elversberg"
function shortName(full) {
  let s = full;
  s = s.replace(/^(?:1\.\s*(?:FC|FSV)|FC|AFC|ACF|AC|AS|AJ|SS|SSC|US|RC|RCD|CA|CD|CS|SD|UD|SC|SV|VfB|VfL|TSG|FK|OGC)\s+(?=\S)/, '');
  s = s.replace(/^(?:(?:18|19|20)\d\d|\d\d)\s+/, '');
  for (let k = 0; k < 3; k++) s = s.replace(/\s+(?:FC|CF|AFC|CFC|UD|BC|SC|AC|OSC|SCO|Calcio|de Fútbol|(?:18|19|20)\d\d)$/, '');
  s = ALIAS[s] || s;
  return s.length >= 3 ? s : full;
}

/* ==================================================================
   DATA
   ================================================================== */
// Full-time score, or null. Since 2025/26 openfootball writes a 0-0 as
// "score": [0, 0] instead of {"ft": [0, 0]}. Without this every 0-0 of the current season
// is lost: the model overestimates goals and underestimates draws.
// The list form is trusted only when the match date has passed.
function scoreFt(sc, day, today) {
  let ft = null;
  if (sc && !Array.isArray(sc) && Array.isArray(sc.ft)) ft = sc.ft;
  else if (Array.isArray(sc) && day < today) ft = sc;
  if (!ft || ft.length !== 2) return null;
  const a = +ft[0], b = +ft[1];
  return Number.isInteger(a) && Number.isInteger(b) && a >= 0 && b >= 0 ? [a, b] : null;
}

async function loadData(onProgress) {
  const today = todayDay();
  const cur = seasonKeyOf(today);
  const seasons = [cur, prevSeason(cur), prevSeason(prevSeason(cur))];
  const jobs = [];
  for (const s of seasons) {
    for (const l of LEAGUES) jobs.push({ s, code: l.code, kind: 'league' });
    for (const c of HISTORY_ONLY) jobs.push({ s, code: c, kind: 'history' });
    for (const c of CUPS) jobs.push({ s, code: c, kind: 'cup' });
  }
  let done = 0;
  const got = await Promise.all(jobs.map(async j => {
    try {
      const r = await fetch(`${BASE}${j.s}/${j.code}.json`, { cache: 'no-cache' });
      return Object.assign({}, j, { json: r.ok ? await r.json() : null });
    } catch (e) {
      return Object.assign({}, j, { json: null, err: true });
    } finally {
      onProgress(++done, jobs.length);
    }
  }));
  const played = [], fixtures = [], files = [];
  const teamLeague = new Map();          // this season's team -> league
  for (const g of got) {
    if (!g.json || !Array.isArray(g.json.matches)) continue;
    files.push({ s: g.s, code: g.code, kind: g.kind, n: g.json.matches.length });
    for (const m of g.json.matches) {
      if (!m.team1 || !m.team2 || !m.date) continue;
      const h = cleanName(m.team1), a = cleanName(m.team2);
      const day = parseDay(m.date);
      const ft = scoreFt(m.score, day, today);
      if (g.kind === 'league' && g.s === cur) { teamLeague.set(h, g.code); teamLeague.set(a, g.code); }
      const rec = { day, time: m.time || '', h, a, comp: g.code, season: g.s, cup: g.kind === 'cup', round: m.round || '' };
      if (ft) {
        rec.hg = ft[0]; rec.ag = ft[1]; played.push(rec);
      } else if (g.kind === 'league' && g.s === cur) {
        fixtures.push(rec);
      }
    }
  }
  played.sort((x, y) => x.day - y.day);
  fixtures.sort((x, y) => x.day - y.day || x.time.localeCompare(y.time));
  const curFiles = files.filter(f => f.s === cur && f.kind === 'league');
  return { cur, seasons, played, fixtures, teamLeague, files, curFiles, failed: got.filter(g => g.err).length, ofCount: played.length };
}

/* ==================================================================
   SNAPSHOT from the data collector (collector/collect.py -> data/latest.js)
   Adds what openfootball does not have: football-data.org results (Champions League
   2025/26 + current, any league result openfootball has not entered yet), official
   tables, Understat xG and bookmaker odds. Optional: without it the page works as before.
   ================================================================== */
function loadSnapshot() {
  return new Promise(resolve => {
    document.querySelectorAll('script[data-snap]').forEach(s => s.remove());
    // LAGA_SNAPSHOT = the name a collector from before the rename writes
    window.MATCHLAB_SNAPSHOT = window.LAGA_SNAPSHOT = undefined;
    const s = document.createElement('script');
    s.dataset.snap = '1';
    // cache-busting only over http(s); a file:// page loads the file as it is
    s.src = 'data/latest.js' + (/^https?:$/.test(location.protocol) ? '?t=' + Math.floor(Date.now() / 60000) : '');
    s.onload = () => resolve(window.MATCHLAB_SNAPSHOT || window.LAGA_SNAPSHOT || null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

const isoDay = d => dayDate(d).toISOString().slice(0, 10);

function mergeSnapshot(data, snap) {
  data.snap = snap || null;
  data.odds = new Map(); data.standings = {}; data.xgN = 0; data.extraN = 0; data.cupTeams = new Set();
  if (!snap) return;
  const today = todayDay();
  const ofCupSeasons = new Set(data.played.filter(r => r.cup).map(r => r.season));
  const near = new Map();              // season|comp|h|a -> [days] of openfootball league matches
  for (const r of data.played) if (!r.cup) {
    const k = `${r.season}|${r.comp}|${r.h}|${r.a}`;
    if (!near.has(k)) near.set(k, []);
    near.get(k).push(r.day);
  }
  for (const e of snap.extra || []) {
    const day = parseDay(e.d);
    if (e.cup) { if (ofCupSeasons.has(e.season)) continue; }            // openfootball caught up: no double count
    else {
      const ds = near.get(`${e.season}|${e.comp}|${e.h}|${e.a}`) || [];
      if (ds.some(d => Math.abs(d - day) <= 3)) continue;
    }
    data.played.push({ day, time: '', h: e.h, a: e.a, comp: e.comp, season: e.season, cup: !!e.cup, round: e.stage || '', hg: e.hg, ag: e.ag, src: e.src });
    data.extraN++;
  }
  data.played.sort((x, y) => x.day - y.day);
  const xg = snap.xg || {};
  for (const r of data.played) {
    const v = xg[`${isoDay(r.day)}|${r.h}|${r.a}`];
    if (v) { r.xh = v[0]; r.xa = v[1]; data.xgN++; }
  }
  // Champions League: this season's clubs and upcoming matches
  for (const e of snap.extra || []) if (e.cup && e.season === data.cur) { data.cupTeams.add(e.h); data.cupTeams.add(e.a); }
  for (const f of snap.cupFixtures || []) {
    data.cupTeams.add(f.h); data.cupTeams.add(f.a);
    const day = parseDay(f.d);
    if (day >= today) data.fixtures.push({ day, time: f.time ? f.time + ' UTC' : '', h: f.h, a: f.a, comp: UCL, season: f.season, cup: true, round: f.stage || '' });
  }
  data.fixtures.sort((x, y) => x.day - y.day || x.time.localeCompare(y.time));
  for (const t of data.cupTeams) if (!data.teamLeague.has(t)) data.teamLeague.set(t, UCL);
  for (const o of snap.odds || []) if (parseDay(o.d) >= today - 1) data.odds.set(`${o.h}|${o.a}`, o);
  data.standings = snap.standings || {};
}

/* ==================================================================
   MODEL
   Hierarchical, time-decayed Dixon-Coles.
     log E[home goals] = mu + home[competition] + att[home] - def[away]
     log E[away goals] = mu + att[away] - def[home]
   att/def shrink to the team's league mean (sd sigma), league means shrink
   to 0 (sd tau), home advantage per competition shrinks to a shared value.
   Match weight = 2^(-age / half-life). Low-score dependence (rho) as in Dixon-Coles.
   ================================================================== */
function teamIndex(played, extra) {
  const set = new Set();
  for (const r of played) { set.add(r.h); set.add(r.a); }
  for (const t of extra) set.add(t);
  const teams = [...set].sort();
  return { teams, idx: new Map(teams.map((t, i) => [t, i])) };
}

function fitModel(played, asof, TI, init) {
  const rows = [];
  for (const r of played) { if (r.day < asof) rows.push(r); else break; }
  const T = TI.teams.length, n = rows.length;
  const compList = [...new Set(rows.map(r => r.comp))].sort();
  const ci = new Map(compList.map((c, i) => [c, i])); const C = compList.length;
  const leagueOf = new Map();
  for (const r of rows) if (!r.cup) { leagueOf.set(r.h, r.comp); leagueOf.set(r.a, r.comp); }
  const lgList = [...new Set([...leagueOf.values(), 'other'])].sort();
  const li = new Map(lgList.map((l, i) => [l, i])); const L = lgList.length;
  const tl = new Int32Array(T);
  for (let i = 0; i < T; i++) tl[i] = li.get(leagueOf.get(TI.teams[i]) || 'other');
  const H = new Int32Array(n), A = new Int32Array(n), CC = new Int32Array(n);
  const X = new Float64Array(n), Y = new Float64Array(n), W = new Float64Array(n);
  const GX = new Float64Array(n), GY = new Float64Array(n);     // real scores: rho is estimated on these
  const k = Math.LN2 / CFG.halfLife, xw = CFG.xgWeight || 0;
  for (let m = 0; m < n; m++) {
    const r = rows[m];
    H[m] = TI.idx.get(r.h); A[m] = TI.idx.get(r.a); CC[m] = ci.get(r.comp);
    GX[m] = r.hg; GY[m] = r.ag;
    // targets: goals, or a blend of goals and xG where Understat has the match
    X[m] = xw > 0 && r.xh !== undefined ? (1 - xw) * r.hg + xw * r.xh : r.hg;
    Y[m] = xw > 0 && r.xa !== undefined ? (1 - xw) * r.ag + xw * r.xa : r.ag;
    W[m] = Math.exp(-k * (asof - r.day));
  }
  const att = init ? Float64Array.from(init.att) : new Float64Array(T);
  const dfn = init ? Float64Array.from(init.dfn) : new Float64Array(T);
  const home = new Float64Array(C).fill(0.25);
  if (init) compList.forEach((c, i) => { if (init.ci.has(c)) home[i] = init.home[init.ci.get(c)]; });
  let mu = init ? init.mu : 0.2;
  const LA = new Float64Array(L), LD = new Float64Array(L), cntL = new Float64Array(L);
  for (let i = 0; i < T; i++) cntL[tl[i]]++;
  if (init) for (let i = 0; i < T; i++) { LA[tl[i]] += att[i]; LD[tl[i]] += dfn[i]; }
  if (init) for (let l = 0; l < L; l++) { const den = cntL[l] / CFG.sigma ** 2 + 1 / CFG.tau ** 2; LA[l] = LA[l] / CFG.sigma ** 2 / den; LD[l] = LD[l] / CFG.sigma ** 2 / den; }
  const s2 = CFG.sigma ** 2, t2 = CFG.tau ** 2, h2 = CFG.homeSd ** 2;
  const lam = new Float64Array(n), nu = new Float64Array(n);
  const g = new Float64Array(T), hs = new Float64Array(T);
  const gc = new Float64Array(C), hc = new Float64Array(C);
  const gl = new Float64Array(L), hl = new Float64Array(L), dl = new Float64Array(L);
  const compute = () => {
    for (let m = 0; m < n; m++) {
      lam[m] = Math.exp(mu + home[CC[m]] + att[H[m]] - dfn[A[m]]);
      nu[m] = Math.exp(mu + att[A[m]] - dfn[H[m]]);
    }
  };
  let it = 0;
  for (; it < CFG.maxIter; it++) {
    let maxStep = 0;
    compute();
    g.fill(0); hs.fill(0);
    for (let m = 0; m < n; m++) {
      const w = W[m];
      g[H[m]] += w * (X[m] - lam[m]); g[A[m]] += w * (Y[m] - nu[m]);
      hs[H[m]] += w * lam[m]; hs[A[m]] += w * nu[m];
    }
    for (let i = 0; i < T; i++) {
      const st = (g[i] - (att[i] - LA[tl[i]]) / s2) / (hs[i] + 1 / s2);
      att[i] += st; if (Math.abs(st) > maxStep) maxStep = Math.abs(st);
    }
    compute();
    g.fill(0); hs.fill(0);
    for (let m = 0; m < n; m++) {
      const w = W[m];
      g[A[m]] -= w * (X[m] - lam[m]); g[H[m]] -= w * (Y[m] - nu[m]);
      hs[A[m]] += w * lam[m]; hs[H[m]] += w * nu[m];
    }
    for (let i = 0; i < T; i++) {
      const st = (g[i] - (dfn[i] - LD[tl[i]]) / s2) / (hs[i] + 1 / s2);
      dfn[i] += st; if (Math.abs(st) > maxStep) maxStep = Math.abs(st);
    }
    LA.fill(0); LD.fill(0);
    for (let i = 0; i < T; i++) { LA[tl[i]] += att[i]; LD[tl[i]] += dfn[i]; }
    for (let l = 0; l < L; l++) { const den = cntL[l] / s2 + 1 / t2; LA[l] = LA[l] / s2 / den; LD[l] = LD[l] / s2 / den; }
    // att+c & mu-c (also def+c & mu+c) changes no prediction; only the N(0, tau) prior on the
    // league means sees it, and it is smallest at c = their mean. Without this the iterations crawl.
    let cA = 0, cD = 0;
    for (let l = 0; l < L; l++) { cA += LA[l]; cD += LD[l]; }
    cA /= L; cD /= L;
    for (let i = 0; i < T; i++) { att[i] -= cA; dfn[i] -= cD; }
    for (let l = 0; l < L; l++) { LA[l] -= cA; LD[l] -= cD; }
    mu += cA - cD;
    // Move a whole league (its teams and its mean together): the team priors do not change, one Newton step.
    compute();
    gl.fill(0); hl.fill(0);
    for (let m = 0; m < n; m++) {
      const w = W[m], lh = tl[H[m]], la = tl[A[m]];
      gl[lh] += w * (X[m] - lam[m]); gl[la] += w * (Y[m] - nu[m]);
      hl[lh] += w * lam[m]; hl[la] += w * nu[m];
    }
    for (let l = 0; l < L; l++) { dl[l] = (gl[l] - LA[l] / t2) / (hl[l] + 1 / t2); LA[l] += dl[l]; }
    for (let i = 0; i < T; i++) att[i] += dl[tl[i]];
    compute();
    gl.fill(0); hl.fill(0);
    for (let m = 0; m < n; m++) {
      const w = W[m], lh = tl[H[m]], la = tl[A[m]];
      gl[la] -= w * (X[m] - lam[m]); gl[lh] -= w * (Y[m] - nu[m]);
      hl[la] += w * lam[m]; hl[lh] += w * nu[m];
    }
    for (let l = 0; l < L; l++) { dl[l] = (gl[l] - LD[l] / t2) / (hl[l] + 1 / t2); LD[l] += dl[l]; }
    for (let i = 0; i < T; i++) dfn[i] += dl[tl[i]];
    compute();
    let h0 = 0; for (let c = 0; c < C; c++) h0 += home[c]; h0 /= Math.max(1, C);
    gc.fill(0); hc.fill(0);
    for (let m = 0; m < n; m++) { gc[CC[m]] += W[m] * (X[m] - lam[m]); hc[CC[m]] += W[m] * lam[m]; }
    for (let c = 0; c < C; c++) home[c] += (gc[c] - (home[c] - h0) / h2) / (hc[c] + 1 / h2);
    compute();
    let num = 0, den = 0;
    for (let m = 0; m < n; m++) { num += W[m] * ((X[m] - lam[m]) + (Y[m] - nu[m])); den += W[m] * (lam[m] + nu[m]); }
    if (den > 0) mu += num / den;
    if (maxStep < CFG.tol) { it++; break; }
  }
  // Dixon-Coles rho: profile likelihood on the 0-0, 1-0, 0-1, 1-1 scores
  compute();
  let best = -Infinity, rho = 0;
  for (let q = -50; q <= 20; q++) {
    const r = q * 0.005; let ll = 0, ok = true;
    for (let m = 0; m < n; m++) {
      const x = GX[m], y = GY[m];
      if (x > 1 || y > 1) continue;
      const t = x === 0 && y === 0 ? 1 - lam[m] * nu[m] * r : x === 0 ? 1 + lam[m] * r : y === 0 ? 1 + nu[m] * r : 1 - r;
      if (t <= 0) { ok = false; break; }
      ll += W[m] * Math.log(t);
    }
    if (ok && ll > best) { best = ll; rho = r; }
  }
  return { att, dfn, home, ci, compList, mu, rho, iters: it, n, asof, leagueOf };
}

function poissonVec(l) {
  const v = new Float64Array(MAXG + 1); v[0] = Math.exp(-l);
  for (let k = 1; k <= MAXG; k++) v[k] = v[k - 1] * l / k;
  return v;
}
function homeAdv(M, comp) {
  if (M.ci.has(comp)) return M.home[M.ci.get(comp)];
  let s = 0; for (const h of M.home) s += h; return s / Math.max(1, M.home.length);
}
function predict(M, hi, ai, comp, neutral) {
  const hc = neutral ? 0 : homeAdv(M, comp);
  const lam = Math.exp(M.mu + hc + M.att[hi] - M.dfn[ai]);
  const nu = Math.exp(M.mu + M.att[ai] - M.dfn[hi]);
  const px = poissonVec(lam), py = poissonVec(nu);
  const G = []; let tot = 0;
  for (let i = 0; i <= MAXG; i++) {
    G.push(new Float64Array(MAXG + 1));
    for (let j = 0; j <= MAXG; j++) G[i][j] = px[i] * py[j];
  }
  const r = M.rho;
  G[0][0] *= 1 - lam * nu * r; G[0][1] *= 1 + lam * r; G[1][0] *= 1 + nu * r; G[1][1] *= 1 - r;
  for (let i = 0; i <= MAXG; i++) for (let j = 0; j <= MAXG; j++) tot += G[i][j];
  let pH = 0, pD = 0, pA = 0, o25 = 0, btts = 0, csH = 0, csA = 0;
  const list = [];
  for (let i = 0; i <= MAXG; i++) for (let j = 0; j <= MAXG; j++) {
    const p = G[i][j] / tot; G[i][j] = p;
    if (i > j) pH += p; else if (i === j) pD += p; else pA += p;
    if (i + j >= 3) o25 += p;
    if (i > 0 && j > 0) btts += p;
    if (j === 0) csH += p;
    if (i === 0) csA += p;
    list.push({ i, j, p });
  }
  list.sort((a, b) => b.p - a.p);
  return { pH, pD, pA, lam, nu, grid: G, o25, btts, csH, csA, top: list.slice(0, 6) };
}

   APP STATE
   ================================================================== */
const S = {
  data: null, TI: null, M: null, fitMs: 0,
  byTeam: new Map(), selectable: [], ref: { att: 0, dfn: 0 }, strength: new Map(),
  home: null, away: null, neutral: false, fixFilter: 'all', rankFilter: 'all',
  status: { kind: '', key: 'stLoading', vars: null }, loading: { key: 'ldFetch', vars: null },
  bt: null, worker: null, btToken: 0,
};
const $ = id => document.getElementById(id);

function setStatus(kind, key, vars) { S.status = { kind, key, vars }; renderStatus(); }
function renderStatus() {
  const el = $('status'); el.className = 'status' + (S.status.kind ? ' ' + S.status.kind : '');
  const v = S.status.vars ? S.status.vars() : null;
  $('status-text').innerHTML = th(S.status.key, v);
}
function setLoading(key, vars) { S.loading = { key, vars }; renderLoading(); }
function renderLoading() { $('loading-text').textContent = tx(S.loading.key, S.loading.vars); }

async function boot() {
  $('reload').disabled = true;
  S.M = null;
  setStatus('', 'stLoading');
  $('loading').hidden = false;
  $('result').querySelectorAll(':scope > :not(#loading)').forEach(e => e.remove());
  setLoading('ldFetch');
  let data;
  try {
    data = await loadData((d, n) => {
      $('loading-bar').style.width = (100 * d / n) + '%';
      setLoading('ldFetchN', { d, n });
    });
  } catch (e) { data = null; }
  if (!data || !data.curFiles.length || !data.played.length) { showError(); return; }
  mergeSnapshot(data, await loadSnapshot());
  S.data = data;
  setLoading('ldTrain', { n: fmtInt(data.played.length) });
  await new Promise(r => setTimeout(r, 30));

  S.TI = teamIndex(data.played, data.teamLeague.keys());
  const t0 = performance.now();
  S.M = fitModel(data.played, todayDay() + 1, S.TI, null);
  S.fitMs = performance.now() - t0;

  // per-team history, newest first
  S.byTeam = new Map();
  for (let k = data.played.length - 1; k >= 0; k--) {
    const r = data.played[k];
    for (const t of [r.h, r.a]) { if (!S.byTeam.has(t)) S.byTeam.set(t, []); S.byTeam.get(t).push(r); }
  }
  // selectable teams = teams in this season's league files that the model knows
  S.selectable = [...data.teamLeague.entries()]
    .filter(([t]) => S.TI.idx.has(t))
    .map(([t, lg]) => ({ name: t, short: shortName(t), league: lg, key: fold(t + ' ' + shortName(t)) }));
  // reference opponent = average top-flight team
  let sa = 0, sd = 0, cnt = 0;
  for (const t of S.selectable) if (LG[t.league] && LG[t.league].top) { const i = S.TI.idx.get(t.name); sa += S.M.att[i]; sd += S.M.dfn[i]; cnt++; }
  S.ref = { att: sa / Math.max(1, cnt), dfn: sd / Math.max(1, cnt) };
  S.strength = new Map();
  for (const t of S.selectable) {
    const i = S.TI.idx.get(t.name);
    const xg = Math.exp(S.M.mu + S.M.att[i] - S.ref.dfn), xga = Math.exp(S.M.mu + S.ref.att - S.M.dfn[i]);
    S.strength.set(t.name, { xg, xga, net: xg - xga, rating: S.M.att[i] + S.M.dfn[i] });
  }
  const ranked = [...S.selectable].sort((a, b) => S.strength.get(b.name).rating - S.strength.get(a.name).rating);
  ranked.forEach((t, k) => { S.strength.get(t.name).rank = k + 1; });
  const perLeague = new Map();
  for (const t of ranked) { const n = (perLeague.get(t.league) || 0) + 1; perLeague.set(t.league, n); S.strength.get(t.name).lrank = n; }

  S.lastDay = data.played.filter(r => !r.cup && r.season === data.cur).reduce((m, r) => Math.max(m, r.day), 0);
  buildTables();
  // openfootball is always used (fetched live); the snapshot lists it as well, so it is not counted twice
  const srcOk = 1 + (data.snap ? Object.entries(data.snap.sources || {}).filter(([k, s]) => k !== 'openfootball' && s && s.ok !== false).length : 0);
  setStatus('live', 'stLive3', () => ({ date: fmtDay(S.lastDay, { day: 'numeric', month: 'short', year: 'numeric' }), n: fmtInt(data.played.length), src: srcOk, ms: fmtInt(S.fitMs) }));

  if (!S.home || !S.TI.idx.has(S.home) || !S.away || !S.TI.idx.has(S.away)) pickDefault();
  $('loading').hidden = true;
  ['in-home', 'in-away', 'swap'].forEach(id => { $(id).disabled = false; });
  renderPicker(); renderResult(); renderStandings(); renderFixtures(); renderRanking(); renderMethod();
  ['tbl-sec', 'fixtures-sec', 'rank-sec', 'acc-sec', 'method-sec'].forEach(id => { $(id).hidden = false; });
  $('reload').disabled = false;
  runBacktest();
}

// League tables (official from the snapshot, else computed from results), each team's table
// position, and this season's xG per match.
function buildTables() {
  const d = S.data;
  S.tables = {}; S.tablePos = new Map(); S.xgSeason = new Map();
  for (const l of LEAGUES) {
    const off = d.standings[l.code];
    let rows;
    if (off && off.table && off.table.length) {
      rows = off.table.map(r => Object.assign({}, r));
    } else {
      const acc = new Map();
      for (const r of d.played) {
        if (r.cup || r.comp !== l.code || r.season !== d.cur) continue;
        for (const [t, gf, ga] of [[r.h, r.hg, r.ag], [r.a, r.ag, r.hg]]) {
          if (!acc.has(t)) acc.set(t, { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
          const x = acc.get(t); x.p++; x.gf += gf; x.ga += ga;
          if (gf > ga) x.w++; else if (gf === ga) x.d++; else x.l++;
        }
      }
      for (const [t, lg] of d.teamLeague) if (lg === l.code && !acc.has(t)) acc.set(t, { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
      rows = [...acc.values()].map(x => Object.assign(x, { gd: x.gf - x.ga, pts: 3 * x.w + x.d }))
        .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.team.localeCompare(b.team));
      rows.forEach((x, k) => { x.pos = k + 1; });
    }
    S.tables[l.code] = { official: !!(off && off.table && off.table.length), updated: off && off.updated, rows };
    for (const r of rows) S.tablePos.set(r.team, { pos: r.pos, pts: r.pts, league: l.code });
  }
  for (const r of d.played) {
    if (r.cup || r.season !== d.cur || r.xh === undefined) continue;
    for (const [t, f, a] of [[r.h, r.xh, r.xa], [r.a, r.xa, r.xh]]) {
      if (!S.xgSeason.has(t)) S.xgSeason.set(t, { f: 0, a: 0, n: 0 });
      const x = S.xgSeason.get(t); x.f += f; x.a += a; x.n++;
    }
  }
}

function showError() {
  setStatus('bad', 'stBad');
  $('loading').hidden = true;
  const box = document.createElement('div');
  box.className = 'error';
  box.innerHTML = `<h3>${esc(tx('errTitle'))}</h3><p>${esc(tx('errBody'))}</p><button class="icon-btn" type="button" id="retry">${esc(tx('retry'))}</button>`;
  $('result').appendChild(box);
  $('retry').addEventListener('click', boot);
  $('reload').disabled = false;
}

function pickDefault() {
  const today = todayDay();
  let best = null, bestScore = -Infinity;
  for (const f of S.data.fixtures) {
    if (f.day < today || f.day > today + 7) continue;
    const a = S.strength.get(f.h), b = S.strength.get(f.a);
    if (!a || !b) continue;
    const s = a.rating + b.rating - Math.abs(a.rating - b.rating) * 0.5;
    if (s > bestScore) { bestScore = s; best = f; }
  }
  if (best) { S.home = best.h; S.away = best.a; return; }
  const ranked = [...S.selectable].sort((a, b) => S.strength.get(b.name).rating - S.strength.get(a.name).rating);
  const first = ranked[0];
  const second = ranked.find(t => t.league === first.league && t.name !== first.name) || ranked[1];
  S.home = first.name; S.away = second.name;
}

/* ==================================================================
   PICKER (combobox)
   ================================================================== */
function setupCombo(side) {
  const input = $(side === 'home' ? 'in-home' : 'in-away');
  const list = $(side === 'home' ? 'list-home' : 'list-away');
  let opts = [], active = -1;
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
  const choose = name => {
    S[side] = name; close(); input.value = shortName(name); input.title = name; renderResult();
  };
  const render = () => {
    if (!S.M) return;
    const q = fold(input.value.trim());
    let pool = S.selectable;
    if (q) {
      pool = pool.filter(t => t.key.includes(q))
        .sort((a, b) => (fold(b.short).startsWith(q) - fold(a.short).startsWith(q)) || a.short.localeCompare(b.short));
    }
    const groups = new Map();
    for (const t of pool) { if (!groups.has(t.league)) groups.set(t.league, []); groups.get(t.league).push(t); }
    let html = ''; opts = [];
    for (const l of DISPLAY_COMPS) {
      const ts = groups.get(l.code); if (!ts) continue;
      if (!q) ts.sort((a, b) => S.strength.get(b.name).rating - S.strength.get(a.name).rating);
      html += `<li class="grp" role="presentation">${esc(l.code === UCL ? tx('grpUcl') : leagueName(l.code))}</li>`;
      for (const t of ts) {
        const id = `${side}-opt-${opts.length}`;
        opts.push({ id, name: t.name });
        html += `<li class="opt" role="option" id="${id}" data-name="${esc(t.name)}" aria-selected="false"><span dir="auto">${esc(t.short)}</span><small>#${S.strength.get(t.name).lrank} ${esc(l.short)}</small></li>`;
      }
    }
    list.innerHTML = html || `<li class="none">${esc(tx('noMatch'))}</li>`;
    list.hidden = false; input.setAttribute('aria-expanded', 'true');
    active = opts.length ? 0 : -1; mark();
  };
  const mark = () => {
    list.querySelectorAll('.opt').forEach((li, k) => li.setAttribute('aria-selected', k === active ? 'true' : 'false'));
    if (active >= 0) {
      input.setAttribute('aria-activedescendant', opts[active].id);
      const li = $(opts[active].id); if (li) li.scrollIntoView({ block: 'nearest' });
    } else input.removeAttribute('aria-activedescendant');
  };
  input.addEventListener('focus', () => { input.select(); render(); });
  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) render(); else { active = Math.min(opts.length - 1, active + 1); mark(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); mark(); }
    else if (e.key === 'Enter') { if (!list.hidden && active >= 0) { e.preventDefault(); choose(opts[active].name); input.blur(); } }
    else if (e.key === 'Escape') { close(); input.value = S[side] ? shortName(S[side]) : ''; }
  });
  list.addEventListener('mousedown', e => {
    const li = e.target.closest('.opt'); if (!li) return;
    e.preventDefault(); choose(li.dataset.name); input.blur();
  });
  input.addEventListener('blur', () => { setTimeout(() => { close(); input.value = S[side] ? shortName(S[side]) : ''; }, 120); });
}

function renderPicker() {
  $('in-home').value = shortName(S.home); $('in-home').title = S.home;
  $('in-away').value = shortName(S.away); $('in-away').title = S.away;
  $('neutral').checked = S.neutral;
}

/* ==================================================================
   RESULT
   ================================================================== */
function formOf(team, n) {
  const out = [];
  for (const r of S.byTeam.get(team) || []) {
    const isH = r.h === team, gf = isH ? r.hg : r.ag, ga = isH ? r.ag : r.hg;
    out.push({ r, isH, gf, ga, res: gf > ga ? 'w' : gf === ga ? 'd' : 'l', opp: isH ? r.a : r.h });
    if (out.length >= n) break;
  }
  return out;
}
const formLetter = res => tx(res === 'w' ? 'fW' : res === 'd' ? 'fD' : 'fL');
const compLabel = r => (r.cup ? tx('ucl') : leagueName(r.comp));

function renderResult() {
  const box = $('result');
  box.querySelectorAll(':scope > :not(#loading)').forEach(e => e.remove());
  if (!S.M) return;
  const H = S.home, A = S.away;
  const div = document.createElement('div');
  if (!H || !A || H === A) {
    div.className = 'empty'; div.style.padding = '18px 4px';
    div.textContent = tx(H === A ? 'pickTwo' : 'pickBoth');
    box.appendChild(div); return;
  }
  const hi = S.TI.idx.get(H), ai = S.TI.idx.get(A);
  const lgH = S.data.teamLeague.get(H), lgA = S.data.teamLeague.get(A);
  const P = predict(S.M, hi, ai, lgH, S.neutral);
  const sh = shortName(H), sa = shortName(A);
  const max = Math.max(P.pH, P.pD, P.pA);
  let head, bigCls, bigP;
  if (max === P.pH) { head = `<span dir="auto">${esc(sh)}</span><small>${esc(tx(S.neutral ? 'favNeutral' : 'favHome'))}</small>`; bigCls = 'var(--home)'; bigP = P.pH; }
  else if (max === P.pA) { head = `<span dir="auto">${esc(sa)}</span><small>${esc(tx(S.neutral ? 'favNeutral' : 'favAway'))}</small>`; bigCls = 'var(--away)'; bigP = P.pA; }
  else { head = `${esc(tx('draw'))}<small>${esc(tx('drawLikely'))}</small>`; bigCls = 'var(--draw)'; bigP = P.pD; }

  const badges = [];
  if (lgH !== lgA) badges.push(`<span class="badge warn" title="${esc(tx('crossLeagueTip'))}">${esc(tx('crossLeague'))}</span>`);
  if (!S.neutral) badges.push(`<span class="badge">${th('homeAdv', { league: leagueName(lgH), x: dec((Math.exp(homeAdv(S.M, lgH)) - 1) * 100, 0) })}</span>`);
  const nH = (S.byTeam.get(H) || []).filter(r => S.lastDay - r.day < 365).length;
  const nA = (S.byTeam.get(A) || []).filter(r => S.lastDay - r.day < 365).length;
  if (Math.min(nH, nA) < 15) {
    const few = nH <= nA ? sh : sa;
    badges.push(`<span class="badge warn" title="${esc(tx('fewDataTip'))}">${th('fewData', { team: few, n: Math.min(nH, nA) })}</span>`);
  }

  const maxCell = Math.max(...Array.from({ length: 6 }, (_, i) => Math.max(...Array.from(P.grid[i]).slice(0, 6))));
  let grid = `<div class="ax"></div>` + [0, 1, 2, 3, 4, 5].map(j => `<div class="ax">${j}</div>`).join('');
  for (let i = 0; i <= 5; i++) {
    grid += `<div class="ax">${i}</div>`;
    for (let j = 0; j <= 5; j++) {
      const p = P.grid[i][j];
      const col = i > j ? 'var(--home)' : i === j ? 'var(--draw)' : 'var(--away)';
      const mix = Math.round(6 + 80 * (p / maxCell));
      const strong = mix > 52;
      const isTop = P.top[0].i === i && P.top[0].j === j;
      grid += `<div class="cell${isTop ? ' best' : ''}" style="background:color-mix(in srgb, ${col} ${mix}%, var(--surface));color:${strong ? 'var(--on-strong)' : 'var(--ink)'}" title="${esc(sh)} ${esc(score(i, j))} ${esc(sa)}: ${esc(pct1(p))}">${p >= 0.0095 ? Math.round(p * 100) : p >= 0.001 ? '·' : ''}</div>`;
    }
  }

  const fH = formOf(H, 5), fA = formOf(A, 5);
  const all = [...S.strength.values()];
  const maxXg = Math.max(...all.map(s => s.xg)), maxXga = Math.max(...all.map(s => s.xga));
  const teamCard = (name, side, f) => {
    const st = S.strength.get(name); const lg = S.data.teamLeague.get(name);
    const chips = f.map(x => `<span class="chip ${x.res}" title="${esc(tx('chipTitle', { date: fmtDay(x.r.day, { day: 'numeric', month: 'short', year: 'numeric' }), comp: compLabel(x.r), venue: tx(x.isH ? 'homeWord' : 'awayWord'), opp: shortName(x.opp), score: score(x.gf, x.ga) }))}">${esc(formLetter(x.res))}</span>`).join('');
    const lastM = f[0];
    const col = side === 'h' ? 'var(--home)' : 'var(--away)';
    const tp = S.tablePos.get(name), xs = S.xgSeason.get(name);
    const extraMeta = (tp ? th('teamTable', { pos: tp.pos, pts: tp.pts }) : '')
      + (xs && xs.n ? (tp ? ' · ' : '') + th('teamXg', { f: dec(xs.f / xs.n), a: dec(xs.a / xs.n) }) : '');
    return `<article class="team ${side}">
      <h4 title="${esc(name)}" dir="auto">${esc(shortName(name))}</h4>
      <div class="meta">${th('teamMeta', { league: leagueName(lg), lr: st.lrank, r: st.rank, n: S.selectable.length })}</div>
      ${extraMeta ? `<div class="meta">${extraMeta}</div>` : ''}
      <div class="rating">
        <span>${esc(tx('attack'))}</span><div class="track"><div class="fill" style="width:${(100 * st.xg / maxXg).toFixed(1)}%;background:${col}"></div></div><span class="n">${esc(tx('goals', { x: dec(st.xg) }))}</span>
        <span>${esc(tx('conceded'))}</span><div class="track"><div class="fill" style="width:${(100 * st.xga / maxXga).toFixed(1)}%;background:var(--loss)"></div></div><span class="n">${esc(tx('goals', { x: dec(st.xga) }))}</span>
      </div>
      <div class="form" aria-label="${esc(tx('formAria'))}">${chips || `<span class="empty">${esc(tx('noMatches'))}</span>`}</div>
      ${lastM ? `<div class="lastline">${th('last', { vs: tx(lastM.isH ? 'vsHome' : 'vsAway'), opp: shortName(lastM.opp), score: score(lastM.gf, lastM.ga), date: fmtDay(lastM.r.day, { day: 'numeric', month: 'short' }), comp: compLabel(lastM.r) })}</div>` : ''}
    </article>`;
  };

  const h2h = [];
  for (const r of S.byTeam.get(H) || []) { if ((r.h === H && r.a === A) || (r.h === A && r.a === H)) h2h.push(r); if (h2h.length >= 6) break; }
  const h2hRows = h2h.map(r => `<tr><td class="dt">${esc(fmtDay(r.day, { day: 'numeric', month: 'short', year: 'numeric' }))}</td><td class="hm" dir="auto">${esc(shortName(r.h))}</td><td class="sc">${esc(score(r.hg, r.ag))}</td><td dir="auto">${esc(shortName(r.a))}</td><td class="dt">${esc(compLabel(r))}</td></tr>`).join('');
  const X = tx('drawSym');

  // bookmaker consensus for this exact fixture (home/away as the market lists it)
  const mk = !S.neutral && S.data.odds ? S.data.odds.get(`${H}|${A}`) : null;
  let market = '';
  if (mk) {
    const dif = [P.pH - mk.p[0], P.pD - mk.p[1], P.pA - mk.p[2]].map(v => (v >= 0 ? '+' : '−') + dec(Math.abs(v) * 100, 0));
    market = `<div class="market">
      <div class="row"><span class="eyebrow">${esc(tx('mktTitle', { n: mk.n }))}</span><span class="diff" dir="ltr">${esc(tx('mktDiff'))}: 1 ${dif[0]} · ${esc(X)} ${dif[1]} · 2 ${dif[2]}</span></div>
      <div class="track"><span class="seg-h" style="flex-basis:${(mk.p[0] * 100).toFixed(1)}%"></span><span class="seg-x" style="flex-basis:${(mk.p[1] * 100).toFixed(1)}%"></span><span class="seg-a" style="flex-basis:${(mk.p[2] * 100).toFixed(1)}%"></span></div>
      <div class="row"><span>1 ${esc(pct(mk.p[0]))} · <b>${esc(dec(mk.best[0]))}</b></span><span>${esc(X)} ${esc(pct(mk.p[1]))} · <b>${esc(dec(mk.best[1]))}</b></span><span>2 ${esc(pct(mk.p[2]))} · <b>${esc(dec(mk.best[2]))}</b></span></div>
      <div class="note">${esc(tx('mktBest'))}: <b>${esc(dec(mk.best[0]))} / ${esc(dec(mk.best[1]))} / ${esc(dec(mk.best[2]))}</b>. ${esc(tx('mktNote'))}</div>
    </div>`;
  }

  div.innerHTML = `
    <div class="result">
      <div class="card">
        <div class="verdict">
          <h3>${head}</h3>
          <div class="big" style="color:${bigCls}">${esc(pct(bigP))}</div>
        </div>
        <div class="badges">${badges.join('')}</div>
        <div class="bar">
          <div class="bar-track" role="img" aria-label="${esc(tx('barAria', { h: sh, ph: pct(P.pH), pd: pct(P.pD), a: sa, pa: pct(P.pA) }))}">
            <span class="seg-h" style="flex-basis:${(P.pH * 100).toFixed(2)}%"></span><span class="seg-x" style="flex-basis:${(P.pD * 100).toFixed(2)}%"></span><span class="seg-a" style="flex-basis:${(P.pA * 100).toFixed(2)}%"></span>
          </div>
          <div class="outcomes">
            <div class="outcome h"><div class="who">1 · ${th('winOf', { team: sh })}</div><div class="p">${esc(pct(P.pH))}</div><div class="odds">${esc(tx('fairOdds'))} <b>${esc(odds(P.pH))}</b></div></div>
            <div class="outcome x"><div class="who">${esc(X)} · ${esc(tx('draw'))}</div><div class="p">${esc(pct(P.pD))}</div><div class="odds">${esc(tx('fairOdds'))} <b>${esc(odds(P.pD))}</b></div></div>

/* ==================================================================
   BACKTEST (walk-forward, in a Web Worker)
   ================================================================== */
// Pure and synchronous, so it can run unchanged inside a Web Worker (it is serialised
// together with fitModel/predict below). onWeek(done, total) reports progress.
function walkForward(played, TI, evalComps, startDay, endDay, onWeek) {
  const out = { n: 0, ll: 0, base: 0, brier: 0, acc: 0, home: 0, bins: Array.from({ length: 10 }, () => ({ n: 0, p: 0, hit: 0 })) };
  let init = null;
  const first = mondayOf(startDay);
  const weeks = Math.max(1, Math.ceil((endDay - first) / 7));
  for (let w = 0, wk = first; wk < endDay; wk += 7, w++) {
    const test = played.filter(r => r.day >= wk && r.day < wk + 7 && evalComps.has(r.comp) && TI.idx.has(r.h) && TI.idx.has(r.a));
    if (test.length) {
      const M = fitModel(played, wk, TI, init); init = M;
      let bh = 0, bd = 0, ba = 0;
      for (const r of played) { if (r.day >= wk) break; if (wk - r.day < 730 && evalComps.has(r.comp)) { if (r.hg > r.ag) bh++; else if (r.hg === r.ag) bd++; else ba++; } }
      const bt = bh + bd + ba || 1; const base = [bh / bt, bd / bt, ba / bt];
      for (const r of test) {
        const P = predict(M, TI.idx.get(r.h), TI.idx.get(r.a), r.comp, false);
        const pv = [P.pH, P.pD, P.pA];
        const o = r.hg > r.ag ? 0 : r.hg === r.ag ? 1 : 2;
        out.ll -= Math.log(Math.max(pv[o], 1e-12)); out.base -= Math.log(Math.max(base[o], 1e-12));
        let b = 0; for (let k = 0; k < 3; k++) b += (pv[k] - (k === o ? 1 : 0)) ** 2; out.brier += b;
        if (pv.indexOf(Math.max(...pv)) === o) out.acc++;
        if (o === 0) out.home++;
        for (let k = 0; k < 3; k++) { const bi = Math.min(9, Math.floor(pv[k] * 10)); out.bins[bi].n++; out.bins[bi].p += pv[k]; out.bins[bi].hit += k === o ? 1 : 0; }
        out.n++;
      }
    }
    onWeek(w + 1, weeks);
  }
  return out;
}

// The walk-forward refits the model once per week of two seasons - tens of fits. In a worker
// the page stays responsive while it runs; if a worker cannot start, it runs here instead.
function backtestWorker() {
  const src = `'use strict';
const CFG = ${JSON.stringify(CFG)};
const MAXG = ${MAXG};
const mondayOf = ${mondayOf.toString()};
${fitModel.toString()}
${poissonVec.toString()}
${homeAdv.toString()}
${predict.toString()}
${walkForward.toString()}
self.onmessage = e => {
  const { played, teams, evalComps, windows } = e.data;
  const TI = { teams, idx: new Map(teams.map((t, i) => [t, i])) };
  const ev = new Set(evalComps);
  for (const w of windows) {
    const t0 = Date.now();
    const r = walkForward(played, TI, ev, w.start, w.end, (d, n) => self.postMessage({ type: 'progress', key: w.key, d, n }));
    r.ms = Date.now() - t0;
    self.postMessage({ type: 'done', key: w.key, r });
  }
  self.postMessage({ type: 'all' });
};`;
  return new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
}

function runBacktest() {
  const cur = S.data.cur, prev = prevSeason(cur), today = todayDay();
  const windows = [
    { key: 'cur', season: cur, subKey: 'accCurSub', start: seasonStart(cur), end: Math.min(today, seasonStart(cur) + 366) },
    { key: 'prev', season: prev, subKey: 'accPrevSub', start: seasonStart(prev), end: seasonStart(cur) },
  ];
  const token = S.btToken = S.btToken + 1;
  if (S.worker) { S.worker.terminate(); S.worker = null; }
  S.bt = { windows, results: {}, progress: {}, done: false };
  renderAccuracy();
  const evalComps = LEAGUES.map(l => l.code);
  const onDone = (key, r) => { S.bt.results[key] = r; S.bt.progress[key] = 1; renderAccCard(windows.find(w => w.key === key)); };
  const finish = () => { S.bt.done = true; renderCalibration(); };
  const inPage = async () => {
    for (const w of windows) {
      await new Promise(res => setTimeout(res, 0));
      if (token !== S.btToken) return;
      const t0 = performance.now();
      const r = walkForward(S.data.played, S.TI, new Set(evalComps), w.start, w.end, () => {});
      r.ms = performance.now() - t0;
      onDone(w.key, r);
    }
    finish();
  };
  let worker = null;
  try { worker = backtestWorker(); } catch (e) { worker = null; }
  if (!worker) { inPage(); return; }
  S.worker = worker;
  worker.onmessage = e => {
    if (token !== S.btToken) return;
    const m = e.data;
    if (m.type === 'progress') { S.bt.progress[m.key] = m.d / m.n; const bar = $(`accbar-${m.key}`); if (bar) bar.style.width = (100 * m.d / m.n) + '%'; }
    else if (m.type === 'done') onDone(m.key, m.r);
    else if (m.type === 'all') { finish(); worker.terminate(); S.worker = null; }
  };
  worker.onerror = e => { e.preventDefault(); worker.terminate(); S.worker = null; if (token === S.btToken) inPage(); };
  worker.postMessage({ played: S.data.played, teams: S.TI.teams, evalComps, windows });
}

// Rebuilds the whole section from S.bt, so a language change mid-run loses nothing.
function renderAccuracy() {
  if (!S.bt) return;
  $('acc').innerHTML = `<div class="acc-cards">${S.bt.windows.map(w => `<div class="acc-card" id="acc-${w.key}"></div>`).join('')}</div>
    <div class="chart" id="acc-chart"></div>`;
  S.bt.windows.forEach(renderAccCard);
  renderCalibration();
}

function renderAccCard(w) {
  const el = $(`acc-${w.key}`); if (!el) return;
  const r = S.bt.results[w.key];
  const title = `<h3>${th('season', { s: seasonLabel(w.season) })}</h3>`;
  if (!r) {
    const p = S.bt.progress[w.key] || 0;
    el.innerHTML = `${title}<div class="sub">${esc(tx(w.subKey))}</div><div class="progress"><span id="accbar-${w.key}" style="width:${(100 * p).toFixed(1)}%"></span></div><div class="sub">${esc(tx(p > 0 ? 'testing' : 'waiting'))}</div>`;
    return;
  }
  if (!r.n) { el.innerHTML = `${title}<div class="sub">${esc(tx('accNone'))}</div>`; return; }
  const ll = r.ll / r.n, base = r.base / r.n, gain = (1 - ll / base) * 100;
  el.innerHTML = `${title}<div class="sub">${esc(tx(w.subKey))} · ${esc(tx('accMeta', { n: fmtInt(r.n), s: dec(r.ms / 1000, 1) }))}</div>
    <div class="kv">
      <div><div class="k">${esc(tx('accTop'))}</div><div class="v">${esc(pct1(r.acc / r.n))}</div></div>
      <div><div class="k">${esc(tx('accHome'))}</div><div class="v">${esc(pct1(r.home / r.n))}</div></div>
      <div><div class="k">${esc(tx('accLL'))}</div><div class="v">${esc(dec(ll, 3))}</div></div>
      <div><div class="k">${esc(tx('accBase'))}</div><div class="v">${esc(dec(base, 3))} <small>${esc(tx('accBaseNote'))}</small></div></div>
      <div><div class="k">${esc(tx('accGain'))}</div><div class="v" style="color:${gain > 0 ? 'var(--win)' : 'var(--loss)'}" dir="ltr">${gain > 0 ? '+' : ''}${esc(dec(gain, 1))}%</div></div>
    </div>`;
}

function renderCalibration() {
  const el = $('acc-chart'); if (!el) return;
  if (!S.bt.done) { el.innerHTML = `<div class="eyebrow">${esc(tx('calib'))}</div><div class="note" style="margin-top:8px">${esc(tx('calibWait'))}</div>`; return; }
  const bins = Array.from({ length: 10 }, () => ({ n: 0, p: 0, hit: 0 }));
  let total = 0;
  for (const r of Object.values(S.bt.results)) { total += r.n; r.bins.forEach((b, k) => { bins[k].n += b.n; bins[k].p += b.p; bins[k].hit += b.hit; }); }
  const W = 360, Hh = 250, L = 40, R = 12, T = 12, B = 34;
  const x = v => L + v * (W - L - R), y = v => T + (1 - v) * (Hh - T - B);
  let dots = '';
  const maxN = Math.max(1, ...bins.map(b => b.n));
  for (const b of bins) {
    if (b.n < 20) continue;
    const px = b.p / b.n, py = b.hit / b.n, rad = 3 + 7 * Math.sqrt(b.n / maxN);
    dots += `<circle cx="${x(px).toFixed(1)}" cy="${y(py).toFixed(1)}" r="${rad.toFixed(1)}" fill="var(--home)" fill-opacity="0.85"><title>${esc(tx('calibDot', { p: pct1(px), q: pct1(py), n: fmtInt(b.n) }))}</title></circle>`;
  }
  let grid = '';
  for (let k = 0; k <= 5; k++) {
    const v = k / 5;
    grid += `<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(NF.pct0.format(v))}</text>`;
    grid += `<text x="${x(v)}" y="${Hh - B + 18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(NF.pct0.format(v))}</text>`;
  }
  el.innerHTML = `<div class="eyebrow">${esc(tx('calibTitle', { n: fmtInt(total) }))}</div>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(tx('calibAria'))}">
      ${grid}
      <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.2"/>
      ${dots}
      <text x="${(L + W - R) / 2}" y="${Hh - 4}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(tx('calibAxis'))}</text>
    </svg>
    <div class="cap">${esc(tx('calibCap'))}</div>`;
}
